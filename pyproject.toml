[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-inference-engine"
version = "0.2.0"
authors = [{ name = "Xingkai Yu" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
description = "A lightweight LLM inference engine built from scratch"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.4.0",
    "triton>=3.0.0",
    "transformers>=4.51.0",
    "flash-attn",
]

[project.urls]
Homepage="https://github.com/GeeeekExplorer/llm-inference-engine"

[tool.setuptools.packages.find]
where = ["."]
include = ["llm_inference_engine*"]
